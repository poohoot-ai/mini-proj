[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "group-order-agent"
version = "0.1.0"
description = "Auto-healing multi-agent group order service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.156.4",
    "pydantic==2.14.1",
    "streamlit==1.62.0",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.coverage.run]
branch = true
source = ["backend", "frontend"]

[tool.coverage.report]
fail_under = 85
show_missing = true
